spring.application.name=smartpark
server.port=8080
server.error.include-message=always



# Database Configuration (Update username and password for your local DB)
spring.datasource.url=jdbc:mysql://mysql:3306/smartpark_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
